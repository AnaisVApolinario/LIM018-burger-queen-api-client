<section class="page page--narrow">
  <h1 class="page__title">{{ isEdit ? 'Editar producto' : 'Nuevo producto' }}</h1>

  <p *ngIf="loading" class="state" role="status">Cargando…</p>
  <p *ngIf="loadError" class="alert alert-error" role="alert">
    No se encontró el producto. <a routerLink="/admin/products">Volver a la lista</a>
  </p>

  <form *ngIf="!loading && !loadError" class="card form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="field">
      <label for="name">Nombre</label>
      <input id="name" type="text" formControlName="name" autocomplete="off" />
      <p class="field__error" *ngIf="name.touched && name.errors?.['required']">
        Ingresa el nombre.
      </p>
    </div>

    <div class="field">
      <label for="price">Precio ($)</label>
      <input id="price" type="number" step="0.5" min="0" formControlName="price" />
      <p class="field__error" *ngIf="price.touched && price.invalid">
        Ingresa un precio mayor que 0.
      </p>
    </div>

    <div class="field">
      <label for="type">Menú</label>
      <select id="type" formControlName="type">
        <option *ngFor="let menu of menus" [value]="menu.value">{{ menu.label }}</option>
      </select>
    </div>

    <div class="field">
      <label for="image">Imagen (ruta o URL)</label>
      <input id="image" type="text" formControlName="image" placeholder="assets/simple.jpg" autocomplete="off" />
      <p class="hint">Opcional. Si la dejas vacía se mostrará un ícono.</p>
    </div>

    <div class="form__actions">
      <a class="btn" routerLink="/admin/products">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>
