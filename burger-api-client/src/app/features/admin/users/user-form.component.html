<section class="page page--narrow">
  <h1 class="page__title">{{ isEdit ? 'Editar empleado' : 'Nuevo empleado' }}</h1>

  <p *ngIf="loading" class="state" role="status">Cargando…</p>
  <p *ngIf="loadError" class="alert alert-error" role="alert">
    No se encontró al empleado. <a routerLink="/admin/users">Volver a la lista</a>
  </p>

  <form *ngIf="!loading && !loadError" class="card form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" formControlName="nombre" autocomplete="off" />
      <p class="field__error" *ngIf="nombre.touched && nombre.errors?.['required']">
        Ingresa el nombre.
      </p>
    </div>

    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" formControlName="email" autocomplete="off" />
      <p class="field__error" *ngIf="email.touched && email.errors?.['required']">
        Ingresa el correo.
      </p>
      <p class="field__error" *ngIf="email.touched && email.errors?.['email']">
        Escribe un correo válido.
      </p>
    </div>

    <div class="field">
      <label for="rol">Rol</label>
      <select id="rol" formControlName="rol">
        <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
      </select>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      <p class="hint" *ngIf="isEdit">Déjala vacía para conservar la actual.</p>
      <p class="field__error" *ngIf="password.touched && password.errors?.['required']">
        Ingresa una contraseña.
      </p>
      <p class="field__error" *ngIf="password.touched && password.errors?.['minlength']">
        Debe tener al menos 6 caracteres.
      </p>
    </div>

    <div class="form__actions">
      <a class="btn" routerLink="/admin/users">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>
