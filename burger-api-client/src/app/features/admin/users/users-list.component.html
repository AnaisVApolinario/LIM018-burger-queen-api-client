<section class="page">
  <div class="page__bar">
    <h1 class="page__title">Empleados</h1>
    <a class="btn btn-primary" routerLink="/admin/users/new">Nuevo empleado</a>
  </div>

  <p *ngIf="loading" class="state" role="status">Cargando empleados…</p>
  <div *ngIf="error" class="alert alert-error" role="alert">
    No se pudo cargar la lista.
    <button type="button" class="btn btn-link" (click)="load()">Reintentar</button>
  </div>

  <div class="table-wrap" *ngIf="!loading && !error">
    <table class="table">
      <caption class="sr-only">
        Lista de empleados
      </caption>
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Correo</th>
          <th scope="col">Rol</th>
          <th scope="col"><span class="sr-only">Acciones</span></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users; trackBy: trackById">
          <td>{{ user.nombre }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge">{{ roleLabels[user.rol] }}</span>
          </td>
          <td class="table__actions">
            <a class="btn" [routerLink]="['/admin/users', user.id]">Editar</a>
            <button
              type="button"
              class="btn btn-danger-ghost"
              [disabled]="isSelf(user)"
              [attr.title]="isSelf(user) ? 'No puedes eliminar tu propia cuenta' : null"
              (click)="remove(user)"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
