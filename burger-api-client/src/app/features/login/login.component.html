<section class="login">
  <div class="login__card">
    <aside class="login__brand">
      <img class="login__logo" src="assets/logoPicture.png" alt="" width="180" height="180" />
      <h1 class="brand-title brand-title--xl">Amero Burger</h1>
      <p class="login__tagline">Pedidos al instante, cocina siempre al día.</p>
    </aside>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div>
        <h2>Bienvenido/a</h2>
        <p class="login__subtitle">Ingresa con tu cuenta de trabajo.</p>
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="nombre@correo.com"
          [attr.aria-invalid]="email.touched && email.invalid"
        />
        <p class="field__error" *ngIf="email.touched && email.errors?.['required']">
          Ingresa tu correo.
        </p>
        <p class="field__error" *ngIf="email.touched && email.errors?.['email']">
          Escribe un correo válido.
        </p>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-group">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="password.touched && password.invalid"
          />
          <button
            type="button"
            class="input-group__toggle"
            aria-controls="password"
            (click)="togglePassword()"
          >
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <p class="field__error" *ngIf="password.touched && password.errors?.['required']">
          Ingresa tu contraseña.
        </p>
      </div>

      <p class="alert alert-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span class="spinner" *ngIf="loading" aria-hidden="true"></span>
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
