<section class="login">
  <div class="login__brand">
    <h1 class="brand-title brand-title--xl">Amero Burger</h1>
    <p>Sistema de pedidos</p>
    <img src="assets/logoPicture.png" alt="" width="200" height="200" />
  </div>

  <form class="card login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2>Iniciar sesión</h2>

    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      <p class="field__error" *ngIf="email.touched && email.errors?.['required']">
        Ingresa tu correo.
      </p>
      <p class="field__error" *ngIf="email.touched && email.errors?.['email']">
        Escribe un correo válido.
      </p>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      <p class="field__error" *ngIf="password.touched && password.errors?.['required']">
        Ingresa tu contraseña.
      </p>
    </div>

    <p class="alert alert-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
      {{ loading ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</section>
